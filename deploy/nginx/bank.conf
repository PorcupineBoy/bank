# ============================================
# 手机银行 Nginx 配置
# ============================================
# 使用方式（二选一）：
#
# 方案 A（推荐，与你现有服务共存）：
#   从下方 server 块中复制 location = /bank、^~ /bank/、^~ /bank/api/
#   三个 location 块，粘贴到你的 cloud.conf 的 server 块中。
#   然后删除本文件：rm /etc/nginx/conf.d/bank.conf
#   执行：sudo nginx -t && sudo systemctl reload nginx
#
# 方案 B（独立子域名）：
#   直接使用下方 server 块，修改 server_name 为独立的域名。
#   执行：sudo nginx -t && sudo systemctl reload nginx
#
# 访问路径：
#   前端 SPA:  https://your.domain/bank/
#   API 接口:  https://your.domain/bank/api/
# ============================================

# ============================================
# server 块（方案 B 用，方案 A 忽略此块，只取内部 location）
# ============================================
#server {
#    listen       80;
#    server_name  bank.your.domain;
#
#    include bank-locations.conf;
#}

# ============================================
# bank-locations.conf（方案 A：直接复制下方内容到 cloud.conf server 块）
# ============================================

# /bank → /bank/ 重定向
location = /bank {
    return 301 /bank/;
}

# 前端静态资源 + SPA 路由
location ^~ /bank/ {
    alias /var/www/bank/dist/;
    index index.html;
    try_files $uri $uri/ /bank/index.html;

    # 静态资源缓存（JS/CSS/图片/字体）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }
}

# 后端 API 代理
location ^~ /bank/api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 超时设置
    proxy_connect_timeout 15s;
    proxy_read_timeout   30s;
    proxy_send_timeout   30s;
}

client_max_body_size 10m;
