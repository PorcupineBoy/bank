# ============================================
# 手机银行 Nginx 配置
# ============================================
# 用法：复制本文件到 /etc/nginx/conf.d/bank.conf
#       修改 server_name 为你的域名，然后：
#       sudo nginx -t && sudo systemctl reload nginx
#
# 访问路径：
#   前端 SPA:  https://your.domain/bank/
#   API 接口:  https://your.domain/bank/api/
# ============================================

server {
    listen       80;
    server_name  cloud.porc.live;   # ← 改为你的域名

    # ========================
    # /bank → /bank/ 重定向
    # ========================
    location = /bank {
        return 301 /bank/;
    }

    # ========================
    # 前端静态资源 + SPA 路由
    # ========================
    location ^~ /bank/ {
        alias /var/www/bank/dist/;
        index index.html;
        try_files $uri $uri/ /bank/index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
            log_not_found off;
        }
    }

    # ========================
    # 后端 API 代理（端口必须与 .env 中 BACKEND_PORT 一致）
    # ========================
    location ^~ /bank/api/ {
        proxy_pass http://127.0.0.1:8080/api/;   # 如 BACKEND_PORT 变更，同步修改此行端口
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_read_timeout   30s;
        proxy_send_timeout   30s;
    }

    client_max_body_size 10m;
}
