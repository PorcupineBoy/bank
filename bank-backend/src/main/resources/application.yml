server:
  port: 8080

spring:
  application:
    name: bank-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/bank_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
  redis:
    host: 127.0.0.1
    port: 6379
    password: root
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.bank.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

bank:
  llm:
    # 当前激活的大模型提供商（可选值：openai / deepseek / xiaomi）
    # 设为 xiaomi 时优先使用小米 MiMo，失败自动降级到 OpenAI/DeepSeek
    provider: xiaomi
    # OpenAI / DeepSeek 配置（给 IntentLlmClient 使用）
    # - OpenAI：https://api.openai.com/v1
    # - DeepSeek：https://api.deepseek.com/v1
    # 未配置时自动降级为关键词匹配，不影响系统正常运行
    api-url: ""
    api-key: ""
    model: deepseek-chat
    timeout: 5000
    # 小米 MiMo 专属配置（给 XiaomiLlmClient 使用）
    xiaomi:
      api-url: ""   # 例如 https://api.momo.mi.com/v1
      api-key: ""
      model: mimo-v2-pro
  jwt:
    secret: bank-mobile-jwt-secret-key-2026
    expiration: 1800000
  aes:
    key: bank-mobile-aes-256-secret-key!!
